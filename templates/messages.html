<!DOCTYPE html>
<html>
<head>
    <title>Message Logs - Iya Meta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .header { background: #d35400; color: white; padding: 20px; text-align: center; }
        .nav { background: #333; padding: 15px; text-align: center; }
        .nav a { color: white; text-decoration: none; margin: 0 15px; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .message { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .incoming { border-left: 5px solid #3498db; }
        .outgoing { border-left: 5px solid #2ecc71; }
        .phone { font-weight: bold; color: #d35400; }
        .time { color: #999; font-size: 12px; }
        .direction { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; color: white; }
        .incoming .direction { background: #3498db; }
        .outgoing .direction { background: #2ecc71; }
    </style>
</head>
<body>
    <div class="header">
        <h1>💬 Message Logs</h1>
    </div>
    
    <div class="nav">
        <a href="/dashboard?password={{ password }}">← Dashboard</a>
        <a href="/dashboard/orders?password={{ password }}">Orders</a>
        <a href="/dashboard/complaints?password={{ password }}">Complaints</a>
        <a href="/dashboard/customers?password={{ password }}">Customers</a>
    </div>
    
    <div class="container">
        {% if filter_phone %}
        <h3>Messages for: {{ filter_phone }}</h3>
        {% endif %}
        
        {% for log in logs %}
        <div class="message {{ log.direction }}">
            <span class="phone">{{ log.phone }}</span>
            <span class="direction">{{ log.direction }}</span>
            <span class="time">{{ log.timestamp }}</span>
            <p>{{ log.message }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
